name: Deploy to Server

on:
  push:
    branches:
      - testing_oct5  # Change to your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Setup SSH key
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # Step 3: Run deploy.sh on EC2
      - name: Run deploy.sh on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@www.assessaai.com "sudo bash /home/ubuntu/deploy.sh testing_oct5"
